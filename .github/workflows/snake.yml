name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: "yasemiliano05-pixel"
          outputs: |
            assets/github-snake.svg?color_snake=purple&color_dots=#161b22,#4c1d95,#6d28d9,#7c3aed,#a78bfa
            assets/github-snake-dark.svg?palette=github-dark&color_snake=purple

      - name: Push changes to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git commit -m "Update snake animation" || echo "No changes to commit"
          git push origin HEAD:main
